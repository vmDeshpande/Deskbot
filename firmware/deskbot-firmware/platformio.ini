[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    links2004/WebSockets@^2.7.2
    bblanchon/ArduinoJson@^6.21.5

monitor_speed = 115200
; upload_speed = 115200

upload_flags =
    --no-stub

